# Serves API-Auth: everything that is not a static file in public/ goes to Laravel.
# It does not depend on nginx seeing index.php, so it works the same for dev (with public/ mounted)
# and for the production image (no code in nginx).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    client_max_body_size 20m;

    location / {
        try_files $uri @laravel;
    }

    # No .php file runs by its path: everything enters through the front controller
    location ~ \.php$ {
        try_files /nonexistent @laravel;
    }

    location @laravel {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
