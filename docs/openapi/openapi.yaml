openapi: 3.1.0
info:
  title: API-Auth
  version: 1.0.0
  description: |
    Microservicio OAuth2 que emite y valida los tokens JWT (RS256) del resto de las APIs.

    **Login central (monolitos):** las personas entran solo por la página de IAM; la contraseña nunca se envía a
    la API (no hay `/v1/login` ni password grant). No hay registro público: los usuarios se crean al entrar por
    primera vez con Microsoft. El satélite manda al navegador a `GET /api/auth/oauth/authorize` (código con PKCE
    `S256`), IAM muestra su login y devuelve un `code` que el satélite canjea en `POST /api/auth/oauth/token`,
    donde también renueva los tokens con `refresh_token`. Con el access token de la persona puede llamar a
    `/v1/me`, `/v1/logout` y `/v1/logout-all`. `GET /api/auth/logout` cierra la sesión central y revoca los
    tokens. El login también ofrece "Ingresar con Microsoft" (Entra ID, solo el tenant de la UBO). Estas páginas
    responden HTML y redirecciones, no problem+json.

    **Otros microservicios:** piden su token a `POST /api/auth/oauth/token` con `client_credentials`. Lo recomendado
    es pedir un token **por API** con el parámetro `api`: el token nombra la API en su `aud`
    (`["<client id>", "api-maestros"]`) y solo sirve en esa API. Para validar el token de un usuario
    pueden usar `/introspect` (detecta revocaciones) o verificar la firma localmente con `/public-key`.

    **Scopes y roles:** viven en la base de datos. Scopes, roles y clientes pertenecen a una aplicación (satélite,
    API o monolito) y los roles conceden scopes de cualquier aplicación. Un token de usuario lleva los scopes de
    los roles del usuario que pertenecen a la aplicación del cliente, sus nombres en la claim `roles` y, en `aud`,
    el client id y las aplicaciones dueñas de sus scopes. Pedir un scope que esos roles no conceden responde
    `400 invalid_scope`.

    **Errores:** las rutas `/api/auth/v1/*` responden los errores en RFC 9457 (`application/problem+json`)
    con un código estable en `error`, como las demás APIs de la UBO:

    | `error` | Estado | Cuándo |
    |---|---|---|
    | `NO_AUTENTICADO` | 401 | Falta el token, o es inválido, vencido o revocado |
    | `SCOPE_INSUFICIENTE` | 403 | El token no tiene el scope que exige la ruta |
    | `VALIDACION` | 422 | Datos inválidos; los mensajes por campo van en `errores` |
    | `RUTA_NO_ENCONTRADA` / `METODO_NO_PERMITIDO` | 404 / 405 | La ruta o el método no existen |
    | `ERROR_INTERNO` | 500 | Error inesperado; el detalle queda solo en el log |

    `POST /api/auth/oauth/token` es el endpoint estándar de Passport y mantiene el formato OAuth2
    (`{error, error_description}`).

    Toda respuesta trae el header `X-Trace-Id` con el `trace_id` de la petición (UBO.Common, módulo Tracing).
  license:
    name: Uso interno
    identifier: LicenseRef-uso-interno

servers:
  - url: /
    description: Relativo al servidor donde se publica la API

tags:
  - name: Usuarios
    description: Perfil y cierre de sesión con el access token de una persona (obtenido en el login central).
  - name: Servicios
    description: Endpoints para otros microservicios.
  - name: Login central
    description: Páginas web de IAM y autorización con código y PKCE para los satélites monolito.
  - name: Salud
    description: Estado del servicio.

paths:
  /api/auth/v1/me:
    get:
      tags: [Usuarios]
      summary: Perfil del usuario
      description: Devuelve el usuario dueño del token. Requiere el scope `user:read`.
      operationId: perfil
      security:
        - tokenUsuario: [user:read]
      responses:
        '200':
          description: Usuario del token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ScopeFaltante' }

  /api/auth/v1/logout:
    post:
      tags: [Usuarios]
      summary: Cerrar la sesión actual
      description: Revoca el access token actual y su refresh token.
      operationId: cerrarSesion
      security:
        - tokenUsuario: []
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
              example: { message: Session closed. }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/auth/v1/logout-all:
    post:
      tags: [Usuarios]
      summary: Cerrar todas las sesiones
      description: Revoca todos los tokens del usuario (todos los dispositivos).
      operationId: cerrarTodasLasSesiones
      security:
        - tokenUsuario: []
      responses:
        '200':
          description: Sesiones cerradas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
              example: { message: All sessions closed. }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/auth/v1/introspect:
    post:
      tags: [Servicios]
      summary: Introspección de un token
      description: |
        Valida un token (firma, vencimiento y revocación) al estilo RFC 7662. Quien llama se autentica con
        un token de cliente (`client_credentials`) que tenga el scope `introspect`. Un token inválido,
        vencido o revocado, o de un usuario dado de baja, responde `200` con `{"active": false}`.

        Los errores son de quien llama, no del token consultado: `401` si su propio token no sirve (UBO.Common
        lo renueva y reintenta una vez), `403` si le falta `introspect` y `422` si falta `token`.
      operationId: introspeccion
      security:
        - tokenServicio: [introspect]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Access token a validar.
      responses:
        '200':
          description: Resultado de la introspección.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenActivo'
                  - $ref: '#/components/schemas/TokenInactivo'
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ScopeFaltante' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/auth/v1/users/{uuid}/revoke:
    post:
      tags: [Servicios]
      summary: Cerrar todas las sesiones de un usuario
      description: |
        Revoca todos los access y refresh tokens del usuario y cierra su sesión de IAM, para que API-IAM
        corte el acceso cuando cambia o da de baja una cuenta. Quien llama se autentica con un token de
        cliente que tenga el scope `sessions:revoke` (rol `session-revoker`). Responde `204` también si el
        usuario no tenía sesiones. Las APIs que validan solo la firma aceptan el access token hasta que vence.
      operationId: revocarSesiones
      security:
        - tokenServicio: [sessions:revoke]
      parameters:
        - name: uuid
          in: path
          required: true
          description: Identificador público del usuario.
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Sesiones cerradas.
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ScopeFaltante' }
        '404':
          description: No existe un usuario con ese `uuid`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/auth/v1/public-key:
    get:
      tags: [Servicios]
      summary: Clave pública
      description: Clave pública PEM para verificar localmente la firma RS256 de los JWT.
      operationId: clavePublica
      security: []
      responses:
        '200':
          description: Clave en formato PEM.
          content:
            application/x-pem-file:
              schema: { type: string }
              example: |
                -----BEGIN PUBLIC KEY-----
                MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA...
                -----END PUBLIC KEY-----

  /api/auth/oauth/token:
    post:
      tags: [Servicios]
      summary: Token de cliente (client_credentials) o canje del código (authorization_code)
      description: |
        Endpoint estándar OAuth2 de Passport. Los microservicios piden aquí su token con su `client_id` y
        `client_secret`. Límite: `OAUTH_TOKEN_RATE_LIMIT` solicitudes por minuto (120 por omisión) por
        `client_id`; al superarlo responde `429` con `Retry-After`.

        **Canje del código** (`grant_type=authorization_code`, login central): el satélite cambia el `code`
        recibido en su `redirect_uri` por el access y el refresh token, con el `code_verifier` de su PKCE y las
        credenciales de su cliente. Los tokens traen los roles y scopes que la persona tiene en la aplicación del
        cliente. Con `grant_type=refresh_token` renueva el par; el refresh vence a los 120 minutos de inactividad.
        Un `code_verifier` incorrecto o un código ya usado responden `400 invalid_grant`.

        - Con `api`: el token solo sirve en esa API. Sin `scope` trae todos los scopes que los roles del
          cliente le dan en esa API; con `scope`, todos deben pertenecer a ella.
        - API inexistente: `400 invalid_request`. Cliente sin scopes en esa API: `400 invalid_scope`.
        - Un cliente sin roles no puede pedir ningún scope. Sin `api` y sin `scope`, el token no trae scopes.
        - Los roles del cliente pueden ser de cualquier aplicación. La claim `roles` del token lleva los roles
          del cliente que conceden alguno de sus scopes.
      operationId: tokenCliente
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials, authorization_code, refresh_token]
                client_id: { type: string }
                client_secret:
                  type: string
                  format: password
                scope:
                  type: string
                  description: Scopes separados por espacio.
                  examples: [introspect]
                api:
                  type: string
                  description: Nombre de la API para la que se pide el token (`client_credentials`).
                  examples: [api-maestros]
                code:
                  type: string
                  description: Código recibido en la `redirect_uri` (`authorization_code`).
                redirect_uri:
                  type: string
                  description: La misma `redirect_uri` de la solicitud de autorización (`authorization_code`).
                code_verifier:
                  type: string
                  description: El verificador cuyo SHA-256 se envió como `code_challenge` (`authorization_code`).
                refresh_token:
                  type: string
                  description: Refresh token a renovar (`refresh_token`).
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                required: [token_type, expires_in, access_token]
                properties:
                  token_type: { type: string, const: Bearer }
                  expires_in:
                    type: integer
                    description: Segundos hasta que vence.
                  access_token: { type: string }
                  refresh_token:
                    type: string
                    description: Solo con `authorization_code` y `refresh_token`.
        '400':
          description: Solicitud inválida (`invalid_request`, `invalid_scope`, `invalid_grant`, `unsupported_grant_type`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorPassport' }
        '401':
          description: Cliente inexistente o secreto incorrecto (`invalid_client`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorPassport' }
        '429':
          description: Se superó el límite de solicitudes del cliente.
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema: { type: integer }

  /api/auth/oauth/authorize:
    get:
      tags: [Login central]
      summary: Autorización con código y PKCE
      description: |
        El satélite manda aquí al navegador de la persona. Sin sesión de IAM la envía a `/api/auth/login` y, al
        terminar, vuelve a esta misma solicitud. Con sesión y roles en la aplicación del cliente redirige a
        `redirect_uri` con `code` y `state`, sin pantalla de consentimiento; el satélite canjea el código en
        `POST /api/auth/oauth/token`.

        - PKCE `S256` es obligatorio: sin `code_challenge` o con otro método responde `400` antes de pedir credenciales.
        - La `redirect_uri` debe estar registrada en el cliente; si no, responde un error y no redirige.
        - `prompt=login` cierra la sesión de IAM y vuelve a pedir la clave. `prompt=consent` no se admite.
        - Sin ningún rol en la aplicación del cliente responde `403` con "No tienes acceso a este sistema,
          contacta a soporte", sin código ni redirección.

        Responde HTML y redirecciones, no problem+json.
      operationId: autorizar
      security: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - name: code_challenge
          in: query
          required: true
          description: SHA-256 del `code_verifier`, en base64url sin relleno.
          schema: { type: string }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: scope, in: query, required: false, description: Scopes separados por espacio., schema: { type: string } }
        - { name: prompt, in: query, required: false, schema: { type: string, enum: [login] } }
      responses:
        '302':
          description: A `redirect_uri` con `code` y `state`, o a `/api/auth/login` si la persona no tiene sesión.
          headers:
            Location: { schema: { type: string } }
        '400':
          description: Falta PKCE `S256` o la solicitud no es válida.
          content:
            text/html: { schema: { type: string } }
        '401':
          description: Cliente desconocido o `redirect_uri` no registrada (`invalid_client`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorPassport' }
        '403':
          description: La persona no tiene roles en la aplicación del cliente.
          content:
            text/html: { schema: { type: string } }

  /api/auth/login:
    get:
      tags: [Login central]
      summary: Formulario de login
      description: |
        Página HTML con el formulario. Si la persona ya tiene sesión, muestra su email y un botón para cerrarla
        (o continúa con la solicitud de autorización pendiente). La sesión de IAM dura 120 minutos sin uso; su
        cookie va acotada a `/api/auth`, `HttpOnly` y `SameSite=Lax`.
      operationId: formularioLogin
      security: []
      responses:
        '200':
          description: Formulario de login.
          content:
            text/html: { schema: { type: string } }
        '302':
          description: Con sesión y una solicitud de autorización pendiente, vuelve a ella.
    post:
      tags: [Login central]
      summary: Enviar el formulario de login
      description: |
        Inicia la sesión de IAM con `email` y `password` (formulario con token CSRF) y redirige al destino
        original, o al formulario si no hay uno. Con credenciales incorrectas o datos inválidos vuelve al
        formulario con el mensaje; un usuario dado de baja ve el mismo mensaje. Con una contraseña temporal
        vigente va a `/api/auth/password`; si venció, vuelve con "Tu contraseña temporal venció, contacta a
        soporte". Rate limit: 10 solicitudes por minuto por email + IP.
      operationId: enviarLogin
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '302':
          description: Sesión iniciada (al destino original) o error (de vuelta al formulario).
          headers:
            Location: { schema: { type: string } }
        '429':
          description: Se superó el rate limit de 10 por minuto por email + IP.
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema: { type: integer }

  /api/auth/login/microsoft:
    get:
      tags: [Login central]
      summary: Ingresar con Microsoft
      description: |
        Botón "Ingresar con Microsoft" del formulario de login: redirige al inicio de sesión de Microsoft Entra ID
        del tenant de la UBO. Solo existe si Entra ID está configurado (`ENTRA_CLIENT_ID`); si no, responde 404.
      operationId: ingresarConMicrosoft
      security: []
      responses:
        '302':
          description: Al inicio de sesión de Microsoft (`login.microsoftonline.com/<tenant>`).
          headers:
            Location: { schema: { type: string } }
        '404':
          description: Entra ID no está configurado.

  /api/auth/login/microsoft/callback:
    get:
      tags: [Login central]
      summary: Vuelta desde Microsoft
      description: |
        Microsoft redirige aquí con `code` y `state`. IAM identifica a la persona por su `oid`; la primera vez
        vincula al usuario con el mismo email (que conserva su contraseña) o crea uno sin contraseña y sin roles.
        Inicia la sesión de IAM y vuelve al destino original. Si Microsoft devuelve un error, el `state` no
        corresponde o el email ya está vinculado a otra cuenta, vuelve al formulario con el mensaje y sin sesión.
      operationId: vueltaDesdeMicrosoft
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '302':
          description: Sesión iniciada (al destino original) o error (de vuelta al formulario).
          headers:
            Location: { schema: { type: string } }
        '404':
          description: Entra ID no está configurado.

  /api/auth/logout:
    get:
      tags: [Login central]
      summary: Logout central iniciado por un satélite
      description: |
        Cierra la sesión de IAM, revoca todos los tokens de acceso y de refresh de la persona (en todos los
        satélites) y redirige a `return` solo si su origen (esquema, host y puerto) coincide con el de una
        `redirect_uri` registrada del cliente. En otro caso, o sin parámetros, muestra la página de sesión
        cerrada. Cambia estado con `GET` porque así se inicia el cierre de sesión desde la aplicación en OIDC.
      operationId: cerrarSesionCentral
      security: []
      parameters:
        - { name: client_id, in: query, required: false, schema: { type: string } }
        - { name: return, in: query, required: false, schema: { type: string, format: uri } }
      responses:
        '200':
          description: Sesión cerrada.
          content:
            text/html: { schema: { type: string } }
        '302':
          description: A `return`, que es de un origen registrado del cliente.
          headers:
            Location: { schema: { type: string } }
    post:
      tags: [Login central]
      summary: Logout desde la página de IAM
      description: Cierra la sesión de IAM, revoca todos los tokens de la persona y vuelve al formulario de login.
      operationId: cerrarSesionIam
      security: []
      responses:
        '302':
          description: Al formulario de login.
          headers:
            Location: { schema: { type: string } }

  /api/auth/password:
    get:
      tags: [Login central]
      summary: Cambio de la contraseña temporal
      description: |
        Página HTML para cambiar una contraseña temporal. Requiere la sesión de IAM; sin sesión va al login, y
        sin contraseña temporal también. Mientras la contraseña sea temporal, `oauth/authorize` no entrega
        códigos y envía aquí.
      operationId: formularioContrasena
      security: []
      responses:
        '200':
          description: Formulario de cambio de contraseña.
          content:
            text/html: { schema: { type: string } }
        '302':
          description: Al login, si no hay sesión o la contraseña no es temporal.
    post:
      tags: [Login central]
      summary: Guardar la nueva contraseña
      description: |
        Guarda la nueva contraseña (formulario con token CSRF), que debe cumplir la política de contraseñas,
        venir confirmada y ser distinta de la temporal. La contraseña deja de ser temporal y la persona sigue
        a la solicitud de autorización pendiente. Con datos inválidos vuelve al formulario con el mensaje.
      operationId: guardarContrasena
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        '302':
          description: Al destino pendiente (o al login), o de vuelta al formulario con el error.
          headers:
            Location: { schema: { type: string } }

  /api/auth/v1/salud:
    get:
      tags: [Salud]
      summary: Estado de la API y de la base de datos
      description: |
        Ejecuta una consulta trivial en la base de datos. Lo usa el healthcheck de nginx en
        `docker-compose.prod.yml`. Misma forma que en las demás APIs de la UBO, bajo el prefijo de cada una.
      operationId: salud
      security: []
      responses:
        '200':
          description: API y base de datos operativas.
          content:
            application/json:
              schema:
                type: object
                required: [estado, base_datos]
                additionalProperties: false
                properties:
                  estado: { type: string, enum: [OK] }
                  base_datos: { type: string, enum: [OK] }
        '503':
          description: Base de datos no disponible.
          content:
            application/json:
              schema:
                type: object
                required: [estado, base_datos]
                additionalProperties: false
                properties:
                  estado: { type: string, enum: [ERROR] }
                  base_datos: { type: string, enum: [NO_DISPONIBLE] }

  /up:
    get:
      tags: [Salud]
      summary: Salud del proceso
      description: Health check de Laravel. Responde `200` si la aplicación arrancó; no consulta la base.
      operationId: saludProceso
      security: []
      responses:
        '200':
          description: El servicio está arriba.

components:
  securitySchemes:
    tokenUsuario:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de usuario obtenido canjeando un código del login central.
    tokenServicio:
      type: oauth2
      description: Token de cliente obtenido con `client_credentials`.
      flows:
        clientCredentials:
          tokenUrl: /api/auth/oauth/token
          scopes:
            introspect: Validar tokens de otros servicios.
            sessions:revoke: Cerrar todas las sesiones de un usuario.

  schemas:
    Usuario:
      type: object
      required: [id, uuid, rut, name, email, email_verified_at, created_at]
      properties:
        id:
          type: integer
          description: ID interno de API-Auth. Los demás sistemas no lo guardan; usan `uuid`.
        uuid:
          type: string
          format: uuid
          description: Identificador público del usuario, no cambia nunca. Es el que guardan los demás sistemas.
        rut:
          type: [string, 'null']
          description: RUT sin puntos, con guion y dígito verificador en mayúscula (`12345678-K`); `null` si no tiene. No viaja en el token.
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    TokenActivo:
      type: object
      required: [active, token_type, client_id, sub, uuid, scope, aud, roles, exp, user]
      properties:
        active: { type: boolean, const: true }
        token_type: { type: string, const: Bearer }
        client_id: { type: string }
        sub:
          type: [string, 'null']
          description: ID interno del usuario; `null` en tokens de cliente. Los demás sistemas guardan `uuid`, no `sub`.
        uuid:
          type: [string, 'null']
          format: uuid
          description: |
            Claim `uuid` del token: identificador público del usuario. `null` en tokens de cliente y en tokens
            emitidos antes de que existiera la claim.
        scope:
          type: string
          description: Scopes separados por espacio.
        aud:
          type: array
          items: { type: string }
          description: |
            Client ID y después las aplicaciones del token: la API pedida en un token de cliente con `api`, o las
            aplicaciones dueñas de los scopes en un token de usuario (en orden alfabético).
        roles:
          type: array
          items: { type: string }
          description: |
            Roles de la claim `roles` del token: los del usuario que pertenecen a la aplicación del cliente, o los
            del cliente que conceden alguno de sus scopes.
        exp:
          type: [integer, 'null']
          description: Vencimiento (timestamp Unix).
        user:
          oneOf:
            - $ref: '#/components/schemas/Usuario'
            - type: 'null'

    TokenInactivo:
      type: object
      required: [active]
      properties:
        active: { type: boolean, const: false }

    Mensaje:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Problema:
      type: object
      description: Error en formato RFC 9457 (`application/problem+json`).
      required: [type, title, status, detail, error]
      properties:
        type: { type: string, const: about:blank }
        title:
          type: string
          description: Resumen legible del problema.
        status:
          type: integer
          description: Código HTTP de la respuesta.
        detail:
          type: string
          description: Explicación de este caso en particular.
        error:
          type: string
          description: |
            Código estable para el programa que llama (ver la descripción de la API).

    ProblemaValidacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          required: [errores]
          properties:
            error: { const: VALIDACION }
            errores:
              type: object
              description: Mensajes de error por campo.
              additionalProperties:
                type: array
                items: { type: string }

    ErrorPassport:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }
        message: { type: string }
        hint: { type: string }

  responses:
    NoAutenticado:
      description: Falta el token o no es válido, está vencido o revocado (`NO_AUTENTICADO`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: No autenticado
            status: 401
            detail: Se requiere un token de acceso válido, vigente y no revocado.
            error: NO_AUTENTICADO
    ScopeFaltante:
      description: El token no tiene el scope requerido (`SCOPE_INSUFICIENTE`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Scope insuficiente
            status: 403
            detail: 'El token no tiene el scope requerido: user:read.'
            error: SCOPE_INSUFICIENTE
    Validacion:
      description: Datos inválidos (`VALIDACION`), con los mensajes por campo en `errores`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaValidacion' }
          example:
            type: about:blank
            title: Datos inválidos
            status: 422
            detail: Los datos enviados no son válidos.
            error: VALIDACION
            errores:
              token: [The token field is required.]
