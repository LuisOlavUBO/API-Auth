openapi: 3.1.0
info:
  title: API-Auth
  version: 1.0.0
  description: |
    Microservicio OAuth2 que emite y valida los tokens JWT (RS256) del resto de las APIs.

    **Usuarios finales:** registro, login, refresh, perfil y logout con el password grant. El secreto del
    cliente nunca sale del servidor: estos endpoints lo usan internamente.

    **Otros microservicios:** piden su token a `POST /oauth/token` con `client_credentials`. Lo recomendado
    es pedir un token **por API** con el parámetro `api`: el token nombra la API en su `aud`
    (`["<client id>", "api-maestros"]`) y solo sirve en esa API. Para validar el token de un usuario
    pueden usar `/introspect` (detecta revocaciones) o verificar la firma localmente con `/public-key`.

    **Scopes:** viven en la base de datos y se asignan por rol. Pedir un scope que el rol no tiene responde
    `400 invalid_scope`.
  license:
    name: Uso interno
    identifier: LicenseRef-uso-interno

servers:
  - url: /
    description: Relativo al servidor donde se publica la API

tags:
  - name: Usuarios
    description: Sesiones de usuarios finales (password grant).
  - name: Servicios
    description: Endpoints para otros microservicios.
  - name: Salud
    description: Estado del servicio.

paths:
  /api/v1/auth/register:
    post:
      tags: [Usuarios]
      summary: Registrar un usuario
      description: Crea la cuenta con el rol por defecto y devuelve su primer par de tokens.
      operationId: registrar
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroSolicitud' }
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [user]
                    properties:
                      user: { $ref: '#/components/schemas/Usuario' }
                  - $ref: '#/components/schemas/ParTokens'
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /api/v1/auth/login:
    post:
      tags: [Usuarios]
      summary: Iniciar sesión
      description: |
        Cambia email y contraseña por un par de tokens. Sin `scope` se pide el scope por defecto
        (`user:read`). Rate limit: 10 solicitudes por minuto por email + IP.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginSolicitud' }
      responses:
        '200':
          description: Credenciales válidas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParTokens' }
        '400': { $ref: '#/components/responses/ErrorOAuth' }
        '401': { $ref: '#/components/responses/CredencialesInvalidas' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /api/v1/auth/refresh:
    post:
      tags: [Usuarios]
      summary: Renovar tokens
      description: |
        Cambia un refresh token por un par nuevo; el refresh anterior queda revocado. Se quitan los scopes
        que el rol del usuario ya no tenga.
      operationId: renovarTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
                scope:
                  type: [string, 'null']
                  description: Scopes separados por espacio.
      responses:
        '200':
          description: Par de tokens nuevo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParTokens' }
        '401': { $ref: '#/components/responses/CredencialesInvalidas' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /api/v1/auth/me:
    get:
      tags: [Usuarios]
      summary: Perfil del usuario
      description: Devuelve el usuario dueño del token. Requiere el scope `user:read`.
      operationId: perfil
      security:
        - tokenUsuario: [user:read]
      responses:
        '200':
          description: Usuario del token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ScopeFaltante' }

  /api/v1/auth/logout:
    post:
      tags: [Usuarios]
      summary: Cerrar la sesión actual
      description: Revoca el access token actual y su refresh token.
      operationId: cerrarSesion
      security:
        - tokenUsuario: []
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
              example: { message: Session closed. }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/v1/auth/logout-all:
    post:
      tags: [Usuarios]
      summary: Cerrar todas las sesiones
      description: Revoca todos los tokens del usuario (todos los dispositivos).
      operationId: cerrarTodasLasSesiones
      security:
        - tokenUsuario: []
      responses:
        '200':
          description: Sesiones cerradas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
              example: { message: All sessions closed. }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/v1/auth/introspect:
    post:
      tags: [Servicios]
      summary: Introspección de un token
      description: |
        Valida un token (firma, vencimiento y revocación) al estilo RFC 7662. Quien llama se autentica con
        un token de cliente (`client_credentials`) que tenga el scope `introspect`. Un token inválido,
        vencido o revocado responde `200` con `{"active": false}`.
      operationId: introspeccion
      security:
        - tokenServicio: [introspect]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Access token a validar.
      responses:
        '200':
          description: Resultado de la introspección.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenActivo'
                  - $ref: '#/components/schemas/TokenInactivo'
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ScopeFaltante' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/v1/auth/public-key:
    get:
      tags: [Servicios]
      summary: Clave pública
      description: Clave pública PEM para verificar localmente la firma RS256 de los JWT.
      operationId: clavePublica
      security: []
      responses:
        '200':
          description: Clave en formato PEM.
          content:
            application/x-pem-file:
              schema: { type: string }
              example: |
                -----BEGIN PUBLIC KEY-----
                MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA...
                -----END PUBLIC KEY-----

  /oauth/token:
    post:
      tags: [Servicios]
      summary: Token de cliente (client_credentials)
      description: |
        Endpoint estándar OAuth2 de Passport. Los microservicios piden aquí su token con su `client_id` y
        `client_secret`.

        - Con `api`: el token solo sirve en esa API. Sin `scope` trae todos los scopes que los roles del
          cliente le dan en esa API; con `scope`, todos deben pertenecer a ella.
        - API inexistente: `400 invalid_request`. Cliente sin scopes en esa API: `400 invalid_scope`.
        - Un cliente sin roles no puede pedir ningún scope.
      operationId: tokenCliente
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                client_id: { type: string }
                client_secret:
                  type: string
                  format: password
                scope:
                  type: string
                  description: Scopes separados por espacio.
                  examples: [introspect]
                api:
                  type: string
                  description: Nombre de la API para la que se pide el token.
                  examples: [api-maestros]
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                required: [token_type, expires_in, access_token]
                properties:
                  token_type: { type: string, const: Bearer }
                  expires_in:
                    type: integer
                    description: Segundos hasta que vence.
                  access_token: { type: string }
        '400':
          description: Solicitud inválida (`invalid_request`, `invalid_scope`, `unsupported_grant_type`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorPassport' }
        '401':
          description: Cliente inexistente o secreto incorrecto (`invalid_client`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorPassport' }

  /up:
    get:
      tags: [Salud]
      summary: Salud del servicio
      description: Health check de Laravel. Responde `200` si la aplicación arrancó.
      operationId: salud
      security: []
      responses:
        '200':
          description: El servicio está arriba.

components:
  securitySchemes:
    tokenUsuario:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de usuario obtenido con `/api/v1/auth/login`.
    tokenServicio:
      type: oauth2
      description: Token de cliente obtenido con `client_credentials`.
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            introspect: Validar tokens de otros servicios.

  schemas:
    RegistroSolicitud:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }

    LoginSolicitud:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        scope:
          type: [string, 'null']
          description: Scopes separados por espacio. Sin valor se pide `user:read`.
          examples: [user:read user:write]

    ParTokens:
      type: object
      required: [token_type, expires_in, access_token, refresh_token]
      properties:
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          description: Segundos hasta que vence el access token.
        access_token: { type: string }
        refresh_token: { type: string }

    Usuario:
      type: object
      required: [id, name, email, email_verified_at, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    TokenActivo:
      type: object
      required: [active, token_type, client_id, sub, scope, aud, exp, user]
      properties:
        active: { type: boolean, const: true }
        token_type: { type: string, const: Bearer }
        client_id: { type: string }
        sub:
          type: [string, 'null']
          description: ID del usuario; `null` en tokens de cliente.
        scope:
          type: string
          description: Scopes separados por espacio.
        aud:
          type: array
          items: { type: string }
          description: Client ID y, si el token es para una API, su nombre.
        exp:
          type: [integer, 'null']
          description: Vencimiento (timestamp Unix).
        user:
          oneOf:
            - $ref: '#/components/schemas/Usuario'
            - type: 'null'

    TokenInactivo:
      type: object
      required: [active]
      properties:
        active: { type: boolean, const: false }

    Mensaje:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ErrorOAuth:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          examples: [invalid_scope]
        message: { type: string }

    ErrorPassport:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }
        message: { type: string }
        hint: { type: string }

    ErrorValidacion:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    ErrorOAuth:
      description: Solicitud OAuth inválida (por ejemplo `invalid_scope`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorOAuth' }
    CredencialesInvalidas:
      description: Credenciales o refresh token inválidos (`invalid_grant`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorOAuth' }
    NoAutenticado:
      description: Falta el token o no es válido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Mensaje' }
          example: { message: Unauthenticated. }
    ScopeFaltante:
      description: El token no tiene el scope requerido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Mensaje' }
    Validacion:
      description: Datos inválidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorValidacion' }
    LimiteExcedido:
      description: Se superó el rate limit (10 por minuto por email + IP).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Mensaje' }
