openapi: 3.1.0
info:
  title: API-Auth
  version: 1.0.0
  description: |
    Microservicio OAuth2 que emite y valida los tokens JWT (RS256) del resto de las APIs.

    **Usuarios finales:** registro, login, refresh, perfil y logout con el password grant. El secreto del
    cliente nunca sale del servidor: estos endpoints lo usan internamente.

    **Otros microservicios:** piden su token a `POST /api/auth/oauth/token` con `client_credentials`. Lo recomendado
    es pedir un token **por API** con el parámetro `api`: el token nombra la API en su `aud`
    (`["<client id>", "api-maestros"]`) y solo sirve en esa API. Para validar el token de un usuario
    pueden usar `/introspect` (detecta revocaciones) o verificar la firma localmente con `/public-key`.

    **Scopes:** viven en la base de datos y se asignan por rol. Pedir un scope que el rol no tiene responde
    `400 invalid_scope`.

    **Errores:** las rutas `/api/auth/v1/*` responden los errores en RFC 9457 (`application/problem+json`)
    con un código estable en `error`, como las demás APIs de la UBO:

    | `error` | Estado | Cuándo |
    |---|---|---|
    | `invalid_grant` | 401 | Login o refresh con credenciales o refresh token inválidos |
    | `invalid_scope`, `invalid_request` | 400 | Login o refresh con un scope o una solicitud OAuth inválidos |
    | `NO_AUTENTICADO` | 401 | Falta el token, o es inválido, vencido o revocado |
    | `SCOPE_INSUFICIENTE` | 403 | El token no tiene el scope que exige la ruta |
    | `VALIDACION` | 422 | Datos inválidos; los mensajes por campo van en `errores` |
    | `LIMITE_EXCEDIDO` | 429 | Rate limit superado; `Retry-After` indica cuándo reintentar |
    | `RUTA_NO_ENCONTRADA` / `METODO_NO_PERMITIDO` | 404 / 405 | La ruta o el método no existen |
    | `ERROR_INTERNO` | 500 | Error inesperado; el detalle queda solo en el log |

    `POST /api/auth/oauth/token` es el endpoint estándar de Passport y mantiene el formato OAuth2
    (`{error, error_description}`).

    Toda respuesta trae el header `X-Trace-Id` con el `trace_id` de la petición (UBO.Common, módulo Tracing).
  license:
    name: Uso interno
    identifier: LicenseRef-uso-interno

servers:
  - url: /
    description: Relativo al servidor donde se publica la API

tags:
  - name: Usuarios
    description: Sesiones de usuarios finales (password grant).
  - name: Servicios
    description: Endpoints para otros microservicios.
  - name: Salud
    description: Estado del servicio.

paths:
  /api/auth/v1/register:
    post:
      tags: [Usuarios]
      summary: Registrar un usuario
      description: Crea la cuenta con el rol por defecto y devuelve su primer par de tokens.
      operationId: registrar
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroSolicitud' }
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [user]
                    properties:
                      user: { $ref: '#/components/schemas/Usuario' }
                  - $ref: '#/components/schemas/ParTokens'
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /api/auth/v1/login:
    post:
      tags: [Usuarios]
      summary: Iniciar sesión
      description: |
        Cambia email y contraseña por un par de tokens. Sin `scope` se pide el scope por defecto
        (`user:read`). Rate limit: 10 solicitudes por minuto por email + IP.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginSolicitud' }
      responses:
        '200':
          description: Credenciales válidas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParTokens' }
        '400': { $ref: '#/components/responses/ErrorOAuth' }
        '401': { $ref: '#/components/responses/CredencialesInvalidas' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /api/auth/v1/refresh:
    post:
      tags: [Usuarios]
      summary: Renovar tokens
      description: |
        Cambia un refresh token por un par nuevo; el refresh anterior queda revocado. Se quitan los scopes
        que el rol del usuario ya no tenga.
      operationId: renovarTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
                scope:
                  type: [string, 'null']
                  description: Scopes separados por espacio.
      responses:
        '200':
          description: Par de tokens nuevo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParTokens' }
        '401': { $ref: '#/components/responses/CredencialesInvalidas' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /api/auth/v1/me:
    get:
      tags: [Usuarios]
      summary: Perfil del usuario
      description: Devuelve el usuario dueño del token. Requiere el scope `user:read`.
      operationId: perfil
      security:
        - tokenUsuario: [user:read]
      responses:
        '200':
          description: Usuario del token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ScopeFaltante' }

  /api/auth/v1/logout:
    post:
      tags: [Usuarios]
      summary: Cerrar la sesión actual
      description: Revoca el access token actual y su refresh token.
      operationId: cerrarSesion
      security:
        - tokenUsuario: []
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
              example: { message: Session closed. }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/auth/v1/logout-all:
    post:
      tags: [Usuarios]
      summary: Cerrar todas las sesiones
      description: Revoca todos los tokens del usuario (todos los dispositivos).
      operationId: cerrarTodasLasSesiones
      security:
        - tokenUsuario: []
      responses:
        '200':
          description: Sesiones cerradas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
              example: { message: All sessions closed. }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/auth/v1/introspect:
    post:
      tags: [Servicios]
      summary: Introspección de un token
      description: |
        Valida un token (firma, vencimiento y revocación) al estilo RFC 7662. Quien llama se autentica con
        un token de cliente (`client_credentials`) que tenga el scope `introspect`. Un token inválido,
        vencido o revocado responde `200` con `{"active": false}`.

        Los errores son de quien llama, no del token consultado: `401` si su propio token no sirve (UBO.Common
        lo renueva y reintenta una vez), `403` si le falta `introspect` y `422` si falta `token`.
      operationId: introspeccion
      security:
        - tokenServicio: [introspect]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Access token a validar.
      responses:
        '200':
          description: Resultado de la introspección.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenActivo'
                  - $ref: '#/components/schemas/TokenInactivo'
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ScopeFaltante' }
        '422': { $ref: '#/components/responses/Validacion' }

  /api/auth/v1/public-key:
    get:
      tags: [Servicios]
      summary: Clave pública
      description: Clave pública PEM para verificar localmente la firma RS256 de los JWT.
      operationId: clavePublica
      security: []
      responses:
        '200':
          description: Clave en formato PEM.
          content:
            application/x-pem-file:
              schema: { type: string }
              example: |
                -----BEGIN PUBLIC KEY-----
                MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA...
                -----END PUBLIC KEY-----

  /api/auth/oauth/token:
    post:
      tags: [Servicios]
      summary: Token de cliente (client_credentials)
      description: |
        Endpoint estándar OAuth2 de Passport. Los microservicios piden aquí su token con su `client_id` y
        `client_secret`.

        - Con `api`: el token solo sirve en esa API. Sin `scope` trae todos los scopes que los roles del
          cliente le dan en esa API; con `scope`, todos deben pertenecer a ella.
        - API inexistente: `400 invalid_request`. Cliente sin scopes en esa API: `400 invalid_scope`.
        - Un cliente sin roles no puede pedir ningún scope.
      operationId: tokenCliente
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                client_id: { type: string }
                client_secret:
                  type: string
                  format: password
                scope:
                  type: string
                  description: Scopes separados por espacio.
                  examples: [introspect]
                api:
                  type: string
                  description: Nombre de la API para la que se pide el token.
                  examples: [api-maestros]
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                required: [token_type, expires_in, access_token]
                properties:
                  token_type: { type: string, const: Bearer }
                  expires_in:
                    type: integer
                    description: Segundos hasta que vence.
                  access_token: { type: string }
        '400':
          description: Solicitud inválida (`invalid_request`, `invalid_scope`, `unsupported_grant_type`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorPassport' }
        '401':
          description: Cliente inexistente o secreto incorrecto (`invalid_client`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorPassport' }

  /api/auth/v1/salud:
    get:
      tags: [Salud]
      summary: Estado de la API y de la base de datos
      description: |
        Ejecuta una consulta trivial en la base de datos. Lo usa el healthcheck de nginx en
        `docker-compose.prod.yml`. Misma forma que en las demás APIs de la UBO, bajo el prefijo de cada una.
      operationId: salud
      security: []
      responses:
        '200':
          description: API y base de datos operativas.
          content:
            application/json:
              schema:
                type: object
                required: [estado, base_datos]
                additionalProperties: false
                properties:
                  estado: { type: string, enum: [OK] }
                  base_datos: { type: string, enum: [OK] }
        '503':
          description: Base de datos no disponible.
          content:
            application/json:
              schema:
                type: object
                required: [estado, base_datos]
                additionalProperties: false
                properties:
                  estado: { type: string, enum: [ERROR] }
                  base_datos: { type: string, enum: [NO_DISPONIBLE] }

  /up:
    get:
      tags: [Salud]
      summary: Salud del proceso
      description: Health check de Laravel. Responde `200` si la aplicación arrancó; no consulta la base.
      operationId: saludProceso
      security: []
      responses:
        '200':
          description: El servicio está arriba.

components:
  securitySchemes:
    tokenUsuario:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de usuario obtenido con `/api/auth/v1/login`.
    tokenServicio:
      type: oauth2
      description: Token de cliente obtenido con `client_credentials`.
      flows:
        clientCredentials:
          tokenUrl: /api/auth/oauth/token
          scopes:
            introspect: Validar tokens de otros servicios.

  schemas:
    RegistroSolicitud:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }

    LoginSolicitud:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        scope:
          type: [string, 'null']
          description: Scopes separados por espacio. Sin valor se pide `user:read`.
          examples: [user:read user:write]

    ParTokens:
      type: object
      required: [token_type, expires_in, access_token, refresh_token]
      properties:
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          description: Segundos hasta que vence el access token.
        access_token: { type: string }
        refresh_token: { type: string }

    Usuario:
      type: object
      required: [id, name, email, email_verified_at, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    TokenActivo:
      type: object
      required: [active, token_type, client_id, sub, scope, aud, exp, user]
      properties:
        active: { type: boolean, const: true }
        token_type: { type: string, const: Bearer }
        client_id: { type: string }
        sub:
          type: [string, 'null']
          description: ID del usuario; `null` en tokens de cliente.
        scope:
          type: string
          description: Scopes separados por espacio.
        aud:
          type: array
          items: { type: string }
          description: Client ID y, si el token es para una API, su nombre.
        exp:
          type: [integer, 'null']
          description: Vencimiento (timestamp Unix).
        user:
          oneOf:
            - $ref: '#/components/schemas/Usuario'
            - type: 'null'

    TokenInactivo:
      type: object
      required: [active]
      properties:
        active: { type: boolean, const: false }

    Mensaje:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Problema:
      type: object
      description: Error en formato RFC 9457 (`application/problem+json`).
      required: [type, title, status, detail, error]
      properties:
        type: { type: string, const: about:blank }
        title:
          type: string
          description: Resumen legible del problema.
        status:
          type: integer
          description: Código HTTP de la respuesta.
        detail:
          type: string
          description: Explicación de este caso en particular.
        error:
          type: string
          description: |
            Código estable para el programa que llama (ver la descripción de la API). Los fallos de login y
            refresh conservan su código OAuth.

    ProblemaValidacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          required: [errores]
          properties:
            error: { const: VALIDACION }
            errores:
              type: object
              description: Mensajes de error por campo.
              additionalProperties:
                type: array
                items: { type: string }

    ErrorPassport:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }
        message: { type: string }
        hint: { type: string }

  responses:
    ErrorOAuth:
      description: Solicitud OAuth inválida (`invalid_scope`, `invalid_request`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Scope inválido
            status: 400
            detail: Check the `introspect` scope
            error: invalid_scope
    CredencialesInvalidas:
      description: Credenciales o refresh token inválidos (`invalid_grant`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Credenciales inválidas
            status: 401
            detail: The user credentials were incorrect.
            error: invalid_grant
    NoAutenticado:
      description: Falta el token o no es válido, está vencido o revocado (`NO_AUTENTICADO`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: No autenticado
            status: 401
            detail: Se requiere un token de acceso válido, vigente y no revocado.
            error: NO_AUTENTICADO
    ScopeFaltante:
      description: El token no tiene el scope requerido (`SCOPE_INSUFICIENTE`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: about:blank
            title: Scope insuficiente
            status: 403
            detail: 'El token no tiene el scope requerido: user:read.'
            error: SCOPE_INSUFICIENTE
    Validacion:
      description: Datos inválidos (`VALIDACION`), con los mensajes por campo en `errores`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaValidacion' }
          example:
            type: about:blank
            title: Datos inválidos
            status: 422
            detail: Los datos enviados no son válidos.
            error: VALIDACION
            errores:
              email: [The email field is required.]
    LimiteExcedido:
      description: Se superó el rate limit de 10 por minuto por email + IP (`LIMITE_EXCEDIDO`).
      headers:
        Retry-After:
          description: Segundos que hay que esperar antes de reintentar.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ErrorInterno:
      description: Error inesperado (`ERROR_INTERNO`). Nunca incluye el detalle interno.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
