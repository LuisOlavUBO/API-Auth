services:
  api:
    build: .
    image: api-auth:latest
    container_name: api-auth
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      RUN_MIGRATIONS: "false"
    volumes:
      - ./storage/oauth-private.key:/run/keys/oauth-private.key:ro
      - ./storage/oauth-public.key:/run/keys/oauth-public.key:ro
