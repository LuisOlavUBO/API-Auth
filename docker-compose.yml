services:
  api:
    build: .
    image: api-auth:latest
    container_name: api-auth
    restart: unless-stopped
    ports:
      # En un servidor compartido el 8000 puede estar ocupado: definir DOCKER_APP_PORT en .env.
      - "${DOCKER_APP_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8000}
      LOG_CHANNEL: stderr
      RUN_MIGRATIONS: "false"
    volumes:
      - ./storage/oauth-private.key:/run/keys/oauth-private.key:ro
      - ./storage/oauth-public.key:/run/keys/oauth-public.key:ro
